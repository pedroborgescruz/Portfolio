  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    (function loadIdea() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("idea") || "";
      const titleEl = document.getElementById("idea-title");
      const subtitleEl = document.getElementById("idea-subtitle");
      const dateEl = document.getElementById("idea-date");
      const bodyEl = document.getElementById("idea-body");

      if (!/^[a-z0-9_-]+$/i.test(slug)) {
        titleEl.textContent = "idea not found";
        bodyEl.innerHTML = "<p>missing or invalid idea.</p>";
        return;
      }

      fetch("assets/ideas/" + encodeURIComponent(slug) + ".txt")
        .then(function (res) {
          if (!res.ok) throw new Error("not found");
          return res.text();
        })
        .then(function (text) {
          const parsed = parseIdea(text, slug);

          titleEl.textContent = parsed.title;
          document.title = parsed.title + " — pedro cruz";

          if (parsed.subtitle) {
            subtitleEl.textContent = parsed.subtitle;
            subtitleEl.hidden = false;
          }

          if (parsed.date) {
            dateEl.textContent = parsed.date;
            dateEl.hidden = false;
          }

          bodyEl.innerHTML = parsed.paragraphs
            .map(function (p) {
              return "<p>" + escapeHtml(p) + "</p>";
            })
            .join("");
        })
        .catch(function () {
          titleEl.textContent = "idea not found";
          bodyEl.innerHTML = "<p>could not load <code>assets/ideas/" +
            escapeHtml(slug) + ".txt</code>.</p>";
        });
    })();

    function parseIdea(text, fallbackTitle) {
      const lines = text.replace(/\r\n/g, "\n").split("\n");
      const meta = {};
      let i = 0;

      while (i < lines.length) {
        const line = lines[i].trim();
        if (!line) {
          i++;
          break;
        }
        const match = line.match(/^(title|subtitle|date)\s*:\s*(.+)$/i);
        if (!match) break;
        meta[match[1].toLowerCase()] = match[2].trim();
        i++;
      }

      const bodyText = lines.slice(i).join("\n").trim();
      let paragraphs = bodyText
        ? bodyText.split(/\n\s*\n/).map(function (block) {
            return block.trim();
          }).filter(Boolean)
        : [];

      // If body is one block of line-separated paragraphs, split by line
      if (paragraphs.length === 1 && paragraphs[0].indexOf("\n") !== -1) {
        paragraphs = paragraphs[0]
          .split("\n")
          .map(function (line) { return line.trim(); })
          .filter(Boolean);
      }

      let title = meta.title || fallbackTitle;
      title = title.replace(/\.$/, "");

      return {
        title: title,
        subtitle: meta.subtitle || "",
        date: meta.date || "",
        paragraphs: paragraphs
      };
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
